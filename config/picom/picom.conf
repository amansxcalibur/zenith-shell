# -------- Rendering --------
backend = "glx";
vsync = true;
dithered-present = false;

# -------- Opacity / Damage --------
frame-opacity = 0.7;
use-damage = true;

detect-client-opacity  = true;
detect-transient       = true;
detect-rounded-corners = true;

# -------- Blur --------
blur-kern = "3x3box";
blur: {
  method    = "gaussian";
  size      = 10;
  deviation = 5.0;
};

# -------- Rounded corners --------
window-shader-fg = "./rounded-borders.glsl";
corner-radius = 17;

# -------- Shadows --------
shadow = true;
shadow-radius   = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity  = 1.0;

# -------- Liquid glass --------
# only our picom fork (liquid-glass branch) reads these, stock picom skips them
liquid-glass: {
  refraction = 45;
  bevel = 30;
  frost = 1.5;
  dispersion = 0.2;
  highlight = 0.6;
  tint = 0.04;
  saturation = 1.25;
};

# -------- Rules --------
rules: (
  {
    match = "role = 'zenith-popup'";
    shadow = false;
    blur-background = true;
  },
  {
    match = "class_i = 'zenith-settings'",
    shadow = false;
    blur-background = false;
    blur-background-frame = false;
    opacity = 1.0;
    corner-radius = 0;
  },
  {
    match = "(window_type = 'popup_menu' || class_i = 'zenith-core') && role != 'zenith-popup'",
    shadow = false;
    blur-background = false;
    blur-background-frame = false;
    opacity = 1.0;
    corner-radius = 0;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
  },
  {
    match = "window_type = 'popup_menu'";
    shadow = false;
    background-opacity = 0.0;
    corner-radius = 17;
  },
  {
    match = "role = 'zenith-dock' || role = 'bottom-pill' || role = 'zenith-top-pill' || role = 'zenith-top-bar' || role = 'zenith-popup' || role = 'zenith-osd' || role = 'zenith-flying'";
    liquid-glass = true;
  }
);
