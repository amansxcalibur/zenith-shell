initial-color-theme=light

[colors-light]
foreground={{colors.on_surface.light.hex_stripped}}
background={{colors.surface.light.hex_stripped}}
cursor={{colors.surface.light.hex_stripped}} {{colors.primary.light.hex_stripped}}
selection-foreground={{colors.on_primary_container.light.hex_stripped}}
selection-background={{colors.primary_container.light.hex_stripped}}
urls={{colors.primary.light.hex_stripped}}

regular0={{colors.surface_container_highest.light.hex_stripped}}
regular1={{colors.red.light.hex_stripped}}
regular2={{colors.green.light.hex_stripped}}
regular3={{colors.yellow.light.hex_stripped}}
regular4={{colors.blue.light.hex_stripped}}
regular5={{colors.magenta.light.hex_stripped}}
regular6={{colors.cyan.light.hex_stripped}}
regular7={{colors.on_surface_variant.light.hex_stripped}}

bright0={{colors.outline.light.hex_stripped}}
bright1={{colors.red.light.hex | lighten: -8.0 | replace: "#", ""}}
bright2={{colors.green.light.hex | lighten: -8.0 | replace: "#", ""}}
bright3={{colors.yellow.light.hex | lighten: -8.0 | replace: "#", ""}}
bright4={{colors.blue.light.hex | lighten: -8.0 | replace: "#", ""}}
bright5={{colors.magenta.light.hex | lighten: -8.0 | replace: "#", ""}}
bright6={{colors.cyan.light.hex | lighten: -8.0 | replace: "#", ""}}
bright7={{colors.on_surface.light.hex_stripped}}
