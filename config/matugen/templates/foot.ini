# -*- conf -*-

shell=/usr/bin/bash

font=monospace:size=12
pad=4x4

# [desktop-notifications]
# command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}

[scrollback]
lines=100000

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

[search-bindings]
cancel=Control+g Control+c Escape

[url-bindings]
cancel=Control+g Control+c Control+d Escape

# Solarized Dark color scheme
[cursor]
color= 002b36 93a1a1

[colors]
alpha=0.9

foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}

# ## Normal/regular colors (color palette 0-7)
# regular0={{colors.surface_container_highest.default.hex_stripped}} # black
# regular1={{colors.error.default.hex_stripped}}                      # red
# regular2={{colors.primary.default.hex_stripped}}                    # green
# regular3={{colors.tertiary.default.hex_stripped}}                   # yellow
# regular4={{colors.secondary.default.hex_stripped}}                  # blue
# regular5={{colors.primary_container.default.hex_stripped}}        # magenta
# regular6={{colors.tertiary_container.default.hex_stripped}}       # cyan
# regular7={{colors.on_surface_variant.default.hex_stripped}}        # white
# 
# ## Bright colors (color palette 8-15)
# bright0={{colors.outline.default.hex_stripped}}                     # bright black
# bright1={{colors.error_container.default.hex_stripped}}           # bright red
# bright2={{colors.primary.default.hex_stripped}}                    # bright green
# bright3={{colors.tertiary.default.hex_stripped}}                   # bright yellow
# bright4={{colors.secondary.default.hex_stripped}}                  # bright blue
# bright5={{colors.inverse_primary.default.hex_stripped}}            # bright magenta
# bright6={{colors.on_tertiary_container.default.hex_stripped}}      # bright cyan
# bright7={{colors.on_surface.default.hex_stripped}}                 # bright white

regular0=2e3436
regular1=cc0000
regular2=4e9a06
regular3=c4a000
regular4=3465a4
regular5=75507b
regular6=06989a
regular7=d3d7cf
bright0=555753
bright1=ef2929
bright2=8ae234
bright3=fce94f
bright4=729fcf
bright5=ad7fa8
bright6=34e2e2
bright7=eeeeec

## Dimmed colors
dim0={{colors.scrim.default.hex_stripped}}
dim1={{colors.outline_variant.default.hex_stripped}}