[config]
# If set to enabled, it will check for updates when you run the matugen command, notifying you that an update is avaiable.
# WARNING: Matugen needs to be compiled with the `update-informer` feature for this to work.
version_check = false

[templates.zenith_dark]
input_path = "./templates/colors.dark.css"
output_path = "../../data/colors.dark.css"

[templates.zenith_light]
input_path = "./templates/colors.light.css"
output_path = "../../data/colors.light.css"

