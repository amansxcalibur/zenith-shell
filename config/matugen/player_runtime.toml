# This config is NOT used as of now

[config]
version_check = false

[templates.zenith_player]
input_path = "./templates/colors_runtime_player.json"
output_path = '../../styles/stash/color.json'

# Only hex values
# https://m3.material.io/styles/color/advanced/adjust-existing-colors#1cc12e43-237b-45b9-8fe0-9a3549c1f61e
# Blend is set to true by default. 
[config.custom_colors]
green = "#00ff00"
red = "#ff0000"
blue = { color = "#0000ff", blend = false }
yellow = "#ffff00"
magenta = "#fd3db5"
cyan = "#00ffff"
white = "#ffffff"
pink = "#e45353"
light_pink = "#ffabab"
